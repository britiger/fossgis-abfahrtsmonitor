<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSSGIS Fahrplan - Bahnhofstafel</title>
    <meta name="author" content="Based on c3-fahrplan-druck by Anton P. Braun and Felix Divo">
    <link rel="stylesheet" href="style.css">
    <script src="lucide.js"></script>
    <script src="config.js"></script>
</head>

<body>
    <noscript>JavaScript is required to render the schedule. Please enable it and reload.</noscript>

    <!-- Title Bar -->
    <div class="titleBar">
        <div class="titleBarLeft">
            <span id="currentTime"></span>
        </div>
        <div class="titleBarRight">
            <span style="font-size: 24px;" id="scheduleVersion"></span>
        </div>
        <div class="titleBarCenter">
            <span class="eventType">Abfahrt</span>
            <span class="stationName">Heidelberg #FOSSGIS2027</span>
        </div>
        <div class="titleBarClear"></div>
    </div>

    <!-- Departure Table -->
    <table id="departureTable">
        <thead>
            <tr>
                <th class="column_time">
                    <span class="firstLanguage">Zeit</span><br>
                    <span class="additionalLanguage">Time</span>
                </th>
                <th class="column_to_from">
                    <span class="firstLanguage">Nach</span><br>
                    <span class="additionalLanguage">Destination</span>
                </th>
                <th class="column_via">
                    <span class="firstLanguage">Sprecher / Raum</span><br>
                    <span class="additionalLanguage">Speaker / Room</span>
                </th>
                <th class="column_track">
                    <span class="firstLanguage">Gleis</span><br>
                    <span class="additionalLanguage">Platform</span>
                </th>
            </tr>
        </thead>
        <tbody id="departures">
            <tr>
                <td class="cell_time" colspan="4">Lade Fahrplan...</td>
            </tr>
        </tbody>
    </table>

    <div id="additionalTextContainer">
        <div class="additionalText" id="footerText">
            FOSSGIS Konferenz - 09.03.2027 bis 13.03.2025
        </div>
    </div>

    <script>
        (async () => {
            // DOM hooks
            const departuresBody = document.getElementById('departures');
            const currentTimeEl = document.getElementById('currentTime');
            const footerText = document.getElementById('footerText');
            const scheduleVersion = document.getElementById('scheduleVersion');
            const departureTableEl = document.getElementById('departureTable');
            const titleBarEl = document.querySelector('.titleBar');

            const showError = (msg) => {
                departuresBody.innerHTML = `<tr><td class="cell_time" colspan="4">${msg}</td></tr>`;
            };

            // Event-specific configuration see config.js
            const eventCfg = window.FossgisFahrplanEventConfig;
            if (!eventCfg ||
                typeof eventCfg.scheduleUrl !== "string" ||
                typeof eventCfg.widgetScheduleUrl !== "string" ||
                !eventCfg.trackMap
            ) {
                showError("Konfiguration fehlt oder ist ungültig (config.js).");
            }
            const {
                scheduleUrl,
                scheduleUrlPrint,
                widgetScheduleUrl,
                freeSeatsUrl,
                trackMap,
                abbreviateRoom,
                isLightningTalk,
                needReservation,
                trainReplaceName,
            } = eventCfg;

            // URL parameter parsing
            const params = new URLSearchParams(location.search);
            const onlyDayParam = params.get('only-day');
            const onlyTrackParam = params.get('only-track');
            const onlyRoomParam = params.get('only-room');
            const generateDelay = params.get('gen-delay');
            const addDaysParm = parseFloat(params.get('addDays') ?? '0');
            const dayIndexStart = parseInt(params.get('dayIndexStart') ?? '1');
            /**
             * Debugging Hilfe:
             * - lokal (localhost oder 127.0.0.1): standardmaessig keine Filterung nach "bereits vorbei"
             * - erzwingen: ?dev=1 (anzeigen) oder ?dev=0 (filtern)
             */
            const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            const devParam = params.get('dev'); // null, "0", "1", ...
            const skipPastFilter = devParam === '1' ? true : devParam === '0' ? false : isLocalhost;
            const isSingleDay = onlyDayParam !== null;
            const selectedDay = parseInt(onlyDayParam ?? '1', 10);

            const setStickyHeights = () => {
                if (!titleBarEl || !departureTableEl) return;
                const theadRow = departureTableEl.querySelector('thead tr');
                if (!theadRow) return;
                const root = document.documentElement;
                root.style.setProperty('--titlebar-height', `${titleBarEl.offsetHeight}px`);
                root.style.setProperty('--thead-height', `${theadRow.offsetHeight}px`);
            };

            let stickyResizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(stickyResizeTimer);
                stickyResizeTimer = setTimeout(setStickyHeights, 120);
            });

            // Update clock
            const updateClock = () => {
                const now = new Date();
                currentTimeEl.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            };
            updateClock();
            setInterval(updateClock, 1000);
            setStickyHeights();

            // Filter predicates
            const trackTarget = onlyTrackParam?.toLowerCase();
            const roomTarget = onlyRoomParam?.toLowerCase();
            const endTalkDate = (date, duration) => {
                const startDate = new Date(date);
                const durationMinutes = toMinutes(duration)
                const debugAddTime = addDaysParm*24*60*60000;
                return new Date(startDate.getTime() + durationMinutes*60000 + debugAddTime);
            };
            const passesFilters = (talk, roomName) => {
                if (trackTarget) {
                    const trackRaw = (talk.track || '').toString().toLowerCase();
                    const trackCode = (trackMap[talk.track] || '').toLowerCase();
                    if (trackRaw !== trackTarget && trackCode !== trackTarget) return false;
                }
                if (roomTarget && !roomName.toLowerCase().match(new RegExp(roomTarget))) return false;
                if (!skipPastFilter && endTalkDate(talk.date, talk.duration) < new Date()) return false;

                return true;
            };

            // Fetch schedule data
            let data;
            let dataOld;
            let dataSeats;
            let seats = {};

            try {
                const res = await fetch(scheduleUrlPrint);
                dataOld = await res.json();
            } catch (e) {
                // No old Data ?
                console.log('Error loading old schedule, maybe not defined.');
            }

            const toMinutes = (hhmm) => parseInt(hhmm.slice(0, 2), 10) * 60 + parseInt(hhmm.slice(-2), 10);
            const toHours = (mins) => `${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
            const timeForSort = (hhmm) => {
                const mins = toMinutes(hhmm);
                return mins < 360 ? mins + (24 * 60) : mins;
            };
            const isoToHHMM = (isoString) => {
                if (!isoString) return "";
                const date = new Date(isoString);
                const hours = String(date.getHours()).padStart(2, "0");
                const minutes = String(date.getMinutes()).padStart(2, "0");
                return `${hours}:${minutes}`;
            };

            // Random delay generator (for fun!)
            const getRandomDelay = () => {
                if (Math.random() > 0.30 || !generateDelay) return ''; // ~30% chance of delay (every 3rd-4th entry)
                const delays = [5, 10, 15, 20, 25, 30, 45, 60];
                const delay = delays[Math.floor(Math.random() * delays.length)];
                return `<span class="tripMessage">ca. ${delay} Minuten später</span>`;
            };

            // Render one departure row
            const renderRow = (talk) => {
                const trackCode = trackMap[talk.track] || 'NAT';
                const trainId = talk.id.toString().substring(0, 5);
                const speaker = (talk.persons || []).map(p => p.name).join(', ') || '';
                const roomAbbrev = abbreviateRoom(talk.roomName);
                const duration = toMinutes(talk.duration);
                const endTime = toHours(toMinutes(talk.start) + duration);
                let talkRoomName = talk.roomName || '-';
                let delayMsg = getRandomDelay();
                let cancelStyle = '';
                let roomStyle = '';
                let roomClass = '';
                let doNotRecord = '';
                let tripMessage = [];

                {
                    const now = new Date();
                    const start = new Date(talk.date);
                    const startDebugBlink = new Date(start.getTime() + addDaysParm*24*60*60000);
                    const end = endTalkDate(talk.date, talk.duration);
                    if (startDebugBlink < now && now < end) {
                        roomClass = ` blink`;
                    }
                }
                if (talk.canceled) {
                    tripMessage.push('Zugausfall')
                    cancelStyle = `text-decoration: line-through; color: red`;
                }
                if(talk.isBreak) {
                    tripMessage.push('Betriebsunterbrechung');
                }
                if (talk.newtalk && !isLightningTalk(talk) && !talk.isBreak) {
                    tripMessage.push(trainReplaceName(talk));
                }
                if(isLightningTalk(talk)) {
                    tripMessage.push('Kurzzug');
                }
                if (talk.newroom) {
                    tripMessage.push('Gleiswechsel');
                    roomStyle = `${roomStyle};color: #FFFF00`;
                }
                if(needReservation(talk)) {
                    tripMessage.push('Reservierungspflichtig');

                    if (seats[talk.code]) {
                        if (seats[talk.code].status == 'open') {
                            // free seats
                            if(seats[talk.code].availability.kind == 'unlimited') {
                                tripMessage.push(`Geringe Auslastung`);
                            }else{
                                tripMessage.push(`Hohe Auslastung, ${seats[talk.code].availability.free} Plätze frei`);
                            }
                        } else {
                            // closes / sold out
                            tripMessage.push('Zug ist ausgebucht');
                        }
                    } else {
                        // No seat information
                        tripMessage.push('Unbekannte Auslastung');
                    }
                }
                if(talk.title.includes(eventCfg.photoName)) {
                    talkRoomName = eventCfg.photoLocation;
                }

                if (tripMessage.length > 0) {
                    delayMsg = `<span class="tripMessage">${tripMessage.join(' | ')}</span>`;
                }

                if (talk.do_not_record) {
                    doNotRecord = '<i data-lucide="video-off" width="0.75em" height="0.75em"></i>';
                }

                return `
                <tr>
                    <td class="cell_time">
                        <span class="time">${talk.start}</span>
                        <span class="tripID">${trackCode} ${trainId} ${doNotRecord}</span>
                    </td>
                    <td>
                        <span class="to_from" style="${cancelStyle}"><a href="${talk.url}" target="_blank">${talk.title}</a></span>
                        ${delayMsg}
                    </td>
                    <td>
                        <span class="path">${speaker}</span>
                        <span class="tripMessage">${talkRoomName} | bis ${endTime}</span>
                    </td>
                    <td>
                        <span class="platform${roomClass}" style="${roomStyle}">${roomAbbrev}</span>
                    </td>
                </tr>`;
            };

            // Render day header row
            const renderDayHeader = (dayIndex, date) => {
                const [year, month, day] = (date || '').split('-');
                const dateStr = date ? `${day}.${month}.${year}` : '';
                dayIndex += (dayIndexStart - 1);
                return `
                <tr class="day-header-row">
                    <td colspan="4">
                        Tag ${dayIndex} - ${dateStr}
                    </td>
                </tr>`;
            };

            // Collect and sort talks
            const collectAndSortTalks = (days, includeDay = true) => {
                const talks = [];
                const talkids = [];
                const oldtalks = {};
                // Add current Talks
                days.forEach((day) => {
                    Object.entries(day.rooms).forEach(([roomName, roomTalks]) => {
                        roomTalks.forEach((talk) => {
                            if (passesFilters(talk, roomName)) {
                                talks.push({ ...talk, dayIndex: day.index, dayDate: day.date, roomName });
                                talkids.push(talk.id);
                            }
                        });
                    });
                });
                // add Breaks
                if(dataWidget) {
                    dataWidget.talks.forEach((talk) => {
                        if (talk.slot_type && talk.slot_type == 'break') {
                            // only breaks, no talks from widget schedule
                            // set missing values im schedule format
                            const startDate = new Date(talk.start);
                            const startTime = isoToHHMM(talk.start);
                            const endDate = new Date(talk.end);
                            const breakDate = startDate.toISOString().split("T")[0];
                            const day = days.find((d) => d.date === breakDate);
                            if(day) {
                                talk.dayIndex = day.index;
                                talk.dayDate = day.date;
                                talk.id = `${day.index}${startTime.replace(':','')}`;
                            }
                            if (typeof talk.title === "object") {
                                title =
                                talk.title["de-formal"] ||
                                talk.title.de ||
                                talk.title.en ||
                                "";
                            } else if (typeof talk.title === "string") {
                                title = talk.title;
                            }
                            if (!title) return;

                            talk.title = title;
                             
                            talk.duration = toHours(Math.floor((endDate - startDate) / 60000));
                            talk.date = startDate.toLocaleString('sv').replace(' ','T') + '+01:00';
                            talk.start = startDate.toLocaleTimeString('de-DE').substring(0,5);
                            talk.roomName = '';
                            talk.track = 'Break';
                            talk.isBreak = true;

                            // check already in list
                            const findSame = talks.find((t) => t.date == talk.date );
                            if(findSame || !passesFilters(talk, '')) return;

                            talks.push(talk);
                        }
                    });
                }
                // Check canceled Talks + Changes
                if(dataOld) {
                    const daysOld = dataOld.schedule.conference.days;
                    daysOld.forEach((day) => {
                        Object.entries(day.rooms).forEach(([roomName, roomTalks]) => {
                            roomTalks.forEach((talk) => {
                                oldtalks[talk.id] = { room: talk.room }
                                if (passesFilters(talk, roomName) && !talkids.includes(talk.id)) {
                                    // Found canceled talk in old schedule
                                    talks.push({ ...talk, dayIndex: day.index, dayDate: day.date, canceled: true, roomName });
                                }
                            });
                        });
                    });
                }
                // Load free seats
                if(dataSeats) {
                    dataSeats.groups.forEach((grp) => {
                            grp.entries.forEach((entry) => {
                                if(entry.pretalxCode) {
                                    seats[entry.pretalxCode] = entry;
                                }
                            });
                        }
                    );
                }
                // find changes
                talks.forEach((talk) => {
                    if (oldtalks[talk.id] == undefined) {
                        talk['newtalk'] = true;
                    } else if (oldtalks[talk.id].room != talk.room) {
                        talk['newroom'] = true;
                    }
                });
                talks.sort((a, b) => {
                    if (includeDay && a.dayIndex !== b.dayIndex) return a.dayIndex - b.dayIndex;
                    const aTime = timeForSort(a.start);
                    const bTime = timeForSort(b.start);
                    if (aTime !== bTime) return aTime - bTime;
                    // ToDo Canceled vs. Replace
                    return a.roomName.localeCompare(b.roomName);
                });
                return talks;
            };

            // Update Schedule
            const updateSchedule = async () => {
                // Fetch current Schedule
                try {
                    var res = await fetch(scheduleUrl);
                    data = await res.json();
                } catch (e) {
                    if (departuresBody.innerHTML.length < 500) {
                        // Show Fetch error only if not loaded before
                        console.log('Error fetching data.')
                        showError('Daten konnten nicht geladen werden. Bitte Verbindung prüfen.');
                    }
                    return;
                }

                try {
                    var res = await fetch(widgetScheduleUrl);
                    dataWidget = await res.json();
                } catch (e) {
                    if (departuresBody.innerHTML.length < 500) {
                        // Show Fetch error only if not loaded before
                        console.log('Error fetching widget data.')
                    }
                }

                try {
                    var res = await fetch(freeSeatsUrl);
                    dataSeats = await res.json();
                } catch (e) {
                        // Show Fetch error only if not loaded before
                        console.log('Error fetching free seats data.')
                }

                // Render schedule
                const days = data.schedule.conference.days;
                let targetDays = days;

                // set current Version in title
                scheduleVersion.textContent = data.schedule.version;

                if (isSingleDay) {
                    const dayObj = days.find((d) => d.index === selectedDay);
                    if (!dayObj) {
                        showError(`Keine Inhalte für Tag ${selectedDay} gefunden.`);
                        return;
                    }
                    targetDays = [dayObj];
                    const [year, month, day] = (dayObj.date || '').split('-');
                    footerText.textContent = `Tag ${selectedDay} - ${day}.${month}.${year}`;
                }

                const allTalks = collectAndSortTalks(targetDays, !isSingleDay);

                if (!allTalks.length) {
                    showError('Keine Fahrten gefunden.');
                    return;
                }

                departuresBody.innerHTML = '';
                let currentDay = null;

                allTalks.forEach((talk) => {
                    if (!isSingleDay && currentDay !== talk.dayIndex) {
                        currentDay = talk.dayIndex;
                        departuresBody.insertAdjacentHTML('beforeend', renderDayHeader(talk.dayIndex, talk.dayDate));
                    }
                    departuresBody.insertAdjacentHTML('beforeend', renderRow(talk));
                });

                // Animate long titles with marquee effect
                const scrollSpeed = 50; // pixels per second
                document.querySelectorAll('.to_from').forEach((el) => {
                    const container = el.closest('td');
                    if (!container) return;

                    const link = el.querySelector('a');
                    if (!link) return;

                    const text = link.textContent;
                    const textDeco = link.parentElement.style.cssText;
                    const containerWidth = container.offsetWidth;

                    // Create temp span to measure text width
                    const tempSpan = document.createElement('span');
                    tempSpan.style.cssText = 'visibility:hidden;position:absolute;white-space:nowrap;font-size:26px;font-weight:bold;';
                    tempSpan.textContent = text;
                    document.body.appendChild(tempSpan);
                    const textWidth = tempSpan.offsetWidth;
                    document.body.removeChild(tempSpan);

                    if (textWidth > containerWidth) {
                        const separator = '\u00A0\u00A0+++\u00A0\u00A0';
                        const fullWidth = textWidth + 60; // approximate separator width
                        const duration = (fullWidth / scrollSpeed) * 1000; // ms

                        link.innerHTML = `<span class="marquee-wrapper animate" style="--scroll-duration:${duration}ms;${textDeco}">${text}${separator}${text}${separator}</span>`;
                    }
                });
                requestAnimationFrame(() => setStickyHeights());
                console.log('Updated at ' + new Date());
                if (window.lucide) window.lucide.createIcons();
            };
            updateSchedule();
            setInterval(updateSchedule, 300000); // 5 Minutes Update
        })();
    </script>
</body>
</html>
